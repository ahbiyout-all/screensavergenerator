[package]
name = "screensavergenerator"
version = "1.1.0"
description = "Windows 화면 보호기 설정 관리자 및 배치 파일 생성기"
authors = ["AhBiYout <redmunlight@gmail.com>"]
homepage = "https://ahbiyoutvibe.blogspot.com/"
repository = "http://www.cisnet.co.kr/"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
chrono = "0.4"
rfd = "0.15"
tauri = { version = "2.11.1" }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
